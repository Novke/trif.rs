<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3F Solutions</title>
    <link rel="icon" type="image/svg+xml" href="resources/logo.svg">
    <link rel="icon" type="image/png" href="resources/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stars.css">
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Intro Animation Overlay -->
    <div id="intro-overlay" class="intro-overlay">
        <div class="intro-content">
            <div id="intro-text-top" class="intro-text-top">
                <p>Learn how we can help you <span id="rotating-word" class="rotating-word"></span></p>
            </div>
            <video id="intro-video" muted playsinline>
                <source src="resources/animations/trif.webm" type="video/webm">
            </video>
            <img id="intro-logo-static" class="intro-logo-static" src="resources/logo-animated.svg" alt="3F Logo">
        </div>
        <div id="intro-skip" class="intro-skip">Click anywhere to continue</div>
    </div>

    <div class="background-gradient"></div>

    <nav class="navbar">
        <div class="logo">
            <a href="#home" data-page="home" class="spa-link"><img src="resources/logo.svg" alt="3F Solutions Logo"></a>
        </div>
        <div class="nav-menu">
            <a href="#home" class="nav-link" data-page="home">3F</a>
            <a href="#o-nama" class="nav-link" data-page="o-nama">O Nama</a>
            <a href="#usluge" class="nav-link" data-page="usluge">Usluge</a>
        </div>
        <div class="navbar-cta-slot">
            <a href="#" onclick="openBooking(event)" class="btn btn-primary" id="navbar-cta">Book a call</a>
        </div>
    </nav>

    <!-- SPA page content renders here -->
    <div id="page-container"></div>

    <script src="stars.js"></script>
    <script>
        (function() {
            var overlay = document.getElementById('intro-overlay');
            var video = document.getElementById('intro-video');
            var introTextTop = document.getElementById('intro-text-top');
            var rotatingWord = document.getElementById('rotating-word');
            var skipText = document.getElementById('intro-skip');

            var words = [
                "grow",
                "scale",
                "convert",
                "automate",
                "stand out",
                "save time",
                "sell more",
                "get leads",
                "build trust",
                "look premium"
            ];

            var wordIndex = 0;
            var wordInterval = null;

            // Check if user has seen intro before
            if (sessionStorage.getItem('introSeen')) {
                overlay.style.display = 'none';
                StarBackground.init({ virtualScroll: false });
                return;
            }

            // Init stars without scroll during intro
            StarBackground.init({ scrollable: false, virtualScroll: false });

            function tryPlayVideo() {
                var playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function() {});
                }
            }

            video.addEventListener('canplaythrough', tryPlayVideo);
            if (video.readyState >= 3) tryPlayVideo();

            video.addEventListener('timeupdate', function() {
                var progress = video.currentTime / video.duration;
                if (progress >= 0.5 && !introTextTop.classList.contains('visible')) {
                    introTextTop.classList.add('visible');
                    rotatingWord.textContent = words[0];
                    rotatingWord.classList.add('animate-in');
                }
            });

            video.addEventListener('ended', function() {
                skipText.classList.add('visible');
                video.classList.add('fade-out');
                setTimeout(function() {
                    document.getElementById('intro-logo-static').classList.add('visible');
                }, 500);

                wordInterval = setInterval(function() {
                    rotatingWord.classList.remove('animate-in');
                    rotatingWord.classList.add('animate-out');

                    setTimeout(function() {
                        wordIndex = (wordIndex + 1) % words.length;
                        rotatingWord.textContent = words[wordIndex];
                        rotatingWord.classList.remove('animate-out');
                        rotatingWord.classList.add('animate-in');
                    }, 300);
                }, 2000);
            });

            overlay.addEventListener('click', function() {
                if (wordInterval) clearInterval(wordInterval);
                overlay.classList.add('fade-out');
                sessionStorage.setItem('introSeen', 'true');
                StarBackground.enableScroll();
                setTimeout(function() {
                    overlay.style.display = 'none';
                }, 600);
            });

            document.addEventListener('keydown', function() {
                if (overlay.style.display !== 'none') {
                    overlay.click();
                }
            });
        })();
    </script>
    <script src="router.js"></script>
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <script>
        function openBooking(e) {
            if (e) e.preventDefault();
            Calendly.initPopupWidget({
                url: 'https://calendly.com/3f-consult/30min',
                primaryColor: '11cece'
            });
        }
    </script>
</body>
</html>
